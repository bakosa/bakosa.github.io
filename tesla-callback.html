<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haku Tesla Auth</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 620px; margin: 48px auto; padding: 0 20px; }
  code { word-break: break-all; background: #f4f4f4; padding: 14px; display: block; border-radius: 8px; }
  button { margin-top: 12px; padding: 10px 18px; font-size: 16px; }
</style>
</head>
<body>
<h1>Tesla authorization</h1>
<p id="msg">Reading result…</p>
<code id="code" style="display:none"></code>
<button id="copy" style="display:none">Copy code</button>
<script>
  var q = new URLSearchParams(location.search);
  var code = q.get("code");
  var err = q.get("error");
  if (code) {
    document.getElementById("msg").textContent = "Success! Copy this code and paste it to Haku:";
    var c = document.getElementById("code");
    c.textContent = code;
    c.style.display = "block";
    var b = document.getElementById("copy");
    b.style.display = "";
    b.onclick = function () { navigator.clipboard.writeText(code); b.textContent = "Copied!"; };
  } else {
    document.getElementById("msg").textContent = "Authorization failed: " + (err || "no code returned");
  }
</script>
</body>
</html>
